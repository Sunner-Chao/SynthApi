# The monitor snapshot exists on the production host only.
# The monitor snapshot is a bounded, read-only response. Keep it on the local
# admin worker and give it enough time to return without affecting other API
# requests.
location = /api/admin/r2-monitor {
    proxy_pass http://127.0.0.1:13000;
    proxy_next_upstream off;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_connect_timeout 2s;
    proxy_http_version 1.1;
    proxy_socket_keepalive on;
    proxy_set_header Host $host;
    proxy_set_header X-SynthAPI-Ingress-Line "";
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
}
