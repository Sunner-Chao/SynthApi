# Authenticated audit queries and streaming media results have their own timeout.
location ^~ /api/media-logs/ {
    proxy_pass http://synthapi_admin_control_workers;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    # Keep administrator audit queries on the local admin worker. Retrying a
    # timed-out query against retired Shanghai/public listeners can turn a
    # slow page into a misleading global 500 response.
    proxy_next_upstream off;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "private, no-store" always;
}
