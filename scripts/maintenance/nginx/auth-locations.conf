    # Authentication and email verification include bounded external checks.
    # Keep POSTs on this node and allow the application to return its own error.
    location ~ ^/api/(user/(login|register|reset)(/.*)?|verification|reset_password)$ {
        proxy_pass http://127.0.0.1:18080;
        proxy_next_upstream off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 2s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-SynthAPI-Ingress-Line "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

