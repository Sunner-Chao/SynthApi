# Tutorials persist independently of frontend release switches and rollbacks.
location ^~ /tutorials/ {
    root /var/www/synthapi-resources;
    try_files $uri =404;
    autoindex off;
    access_log off;
    open_file_cache off;
    types {
        video/mp4 mp4;
        application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
        text/plain srt;
        text/vtt vtt;
    }
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options nosniff always;
}

# Old bookmarks and already-open frontend tabs resolve to the current V5 files.
location = /tutorials/synthapi-cc-switch-v2.mp4 {
    return 302 /tutorials/synthapi-cc-switch-v5-gpt6sol.mp4;
}
location = /tutorials/synthapi-cc-switch-v2.docx {
    return 302 /tutorials/synthapi-cc-switch-v5-gpt6sol.docx;
}
location = /tutorials/synthapi-cc-switch-v2.srt {
    return 302 /tutorials/synthapi-cc-switch-v5-gpt6sol.srt;
}
location = /tutorials/synthapi-cc-switch-v5.mp4 {
    return 302 /tutorials/synthapi-cc-switch-v5-gpt6sol.mp4;
}
location = /tutorials/synthapi-cc-switch-v5.docx {
    return 302 /tutorials/synthapi-cc-switch-v5-gpt6sol.docx;
}
