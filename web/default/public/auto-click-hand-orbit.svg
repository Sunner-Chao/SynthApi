<svg xmlns="http://www.w3.org/2000/svg" width="454" height="455" viewBox="0 0 454 455" fill="none">
  <defs>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 145) rotate(90) scale(176)">
      <stop stop-color="#8B7BFF" stop-opacity=".34"/>
      <stop offset=".46" stop-color="#2C9CFF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#05142A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="handFill" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(290 304) rotate(118) scale(215 190)">
      <stop stop-color="#112E52"/>
      <stop offset=".56" stop-color="#07162B"/>
      <stop offset="1" stop-color="#020A17"/>
    </radialGradient>
    <linearGradient id="edge" x1="189" y1="146" x2="432" y2="424" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".26" stop-color="#7CEBFF"/>
      <stop offset=".62" stop-color="#A8B5FF"/>
      <stop offset="1" stop-color="#39C8FF"/>
    </linearGradient>
    <linearGradient id="beam" x1="18" y1="0" x2="436" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25D7FF" stop-opacity="0"/>
      <stop offset=".18" stop-color="#25D7FF"/>
      <stop offset=".5" stop-color="#B3A0FF"/>
      <stop offset=".82" stop-color="#25D7FF"/>
      <stop offset="1" stop-color="#25D7FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring" x1="120" y1="76" x2="320" y2="252" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4EE5FF"/>
      <stop offset=".45" stop-color="#8D7DFF"/>
      <stop offset="1" stop-color="#E66EFF"/>
    </linearGradient>
    <linearGradient id="nail" x1="208" y1="130" x2="235" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#B7F7FF" stop-opacity=".9"/>
      <stop offset=".72" stop-color="#A28CFF" stop-opacity=".78"/>
      <stop offset="1" stop-color="#FFB4F4" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="nailEdge" x1="210" y1="132" x2="230" y2="155" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#8DEBFF"/>
      <stop offset="1" stop-color="#B18CFF"/>
    </linearGradient>
    <filter id="blur12" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="blur4" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="edgeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .orbit { transform-box: fill-box; transform-origin: center; animation: orbitPulse 2.4s ease-out infinite; }
      .orbit.delay1 { animation-delay: .28s; }
      .orbit.delay2 { animation-delay: .56s; }
      .spark { animation: sparkPulse 1.9s ease-in-out infinite; }
      .spark.delay1 { animation-delay: .55s; }
      .spark.delay2 { animation-delay: 1.05s; }
      @keyframes orbitPulse { 0%, 100% { opacity: .52; transform: scale(.96); } 48% { opacity: .96; transform: scale(1.03); } }
      @keyframes sparkPulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .orbit, .spark { animation: none; } }
    </style>
  </defs>

  <circle cx="220" cy="151" r="174" fill="url(#halo)" opacity=".72"/>

  <g opacity=".9">
    <circle class="orbit" cx="220" cy="145" r="38" stroke="url(#ring)" stroke-width="2"/>
    <circle class="orbit delay1" cx="220" cy="145" r="68" stroke="url(#ring)" stroke-width="1.7" opacity=".84"/>
    <circle class="orbit delay2" cx="220" cy="145" r="101" stroke="url(#ring)" stroke-width="1.45" opacity=".7"/>
    <circle class="orbit" cx="220" cy="145" r="136" stroke="url(#ring)" stroke-width="1.2" opacity=".45" stroke-dasharray="2 8"/>
    <circle class="orbit delay1" cx="220" cy="145" r="162" stroke="#4A7BFF" stroke-width="1" opacity=".26" stroke-dasharray="1 12"/>
  </g>

  <path d="M18 10H435" stroke="url(#beam)" stroke-width="2" opacity=".9"/>
  <path d="M18 178H435" stroke="url(#beam)" stroke-width="3" opacity=".95" filter="url(#blur4)"/>
  <path d="M18 178H435" stroke="url(#beam)" stroke-width="1.2" opacity=".98"/>
  <path d="M44 182H407" stroke="#3ABFFF" stroke-width="1" opacity=".28"/>

  <g class="spark" fill="#8EEBFF">
    <circle cx="109" cy="148" r="1.8"/>
    <circle cx="315" cy="146" r="1.6"/>
    <circle cx="152" cy="36" r="1.5"/>
    <circle cx="284" cy="28" r="1.3"/>
  </g>
  <g class="spark delay1" fill="#BD8CFF">
    <circle cx="91" cy="96" r="1.4"/>
    <circle cx="349" cy="87" r="1.7"/>
    <circle cx="124" cy="229" r="1.2"/>
  </g>
  <g class="spark delay2" fill="#FFFFFF">
    <circle cx="220" cy="145" r="4" filter="url(#blur4)"/>
    <circle cx="220" cy="145" r="1.8"/>
  </g>

  <circle cx="220" cy="145" r="21" fill="#DDA8FF" opacity=".22" filter="url(#blur12)"/>
  <circle cx="220" cy="145" r="13" fill="#FFF4FF" opacity=".92" filter="url(#blur4)"/>
  <circle cx="220" cy="145" r="10" fill="#FFB4F7" opacity=".78"/>
  <circle cx="220" cy="145" r="9" stroke="#FFFFFF" stroke-width="2"/>

  <path d="M209 145C206 132 213 124 224 127C235 130 238 140 239 157L249 237C250 249 255 258 261 250L269 216C272 203 281 196 292 198C304 200 309 210 310 223L317 275C318 286 323 291 328 281L333 239C335 227 345 221 355 223C366 225 371 235 372 247L376 291C377 301 382 304 387 296L389 268C390 256 399 250 408 254C418 258 422 269 423 282L431 369C433 397 443 429 454 455H257C251 434 240 408 222 389C207 373 193 357 184 339C177 325 175 309 181 296C187 283 199 280 210 286L230 302C236 307 241 302 240 293Z" fill="url(#handFill)" stroke="#5EDFFF" stroke-width="7" opacity=".42" filter="url(#blur4)"/>
  <path d="M209 145C206 132 213 124 224 127C235 130 238 140 239 157L249 237C250 249 255 258 261 250L269 216C272 203 281 196 292 198C304 200 309 210 310 223L317 275C318 286 323 291 328 281L333 239C335 227 345 221 355 223C366 225 371 235 372 247L376 291C377 301 382 304 387 296L389 268C390 256 399 250 408 254C418 258 422 269 423 282L431 369C433 397 443 429 454 455H257C251 434 240 408 222 389C207 373 193 357 184 339C177 325 175 309 181 296C187 283 199 280 210 286L230 302C236 307 241 302 240 293Z" fill="url(#handFill)" stroke="url(#edge)" stroke-width="2.4" filter="url(#edgeGlow)"/>

  <!-- Continuous palm bridge removes the self-intersection gap at the finger root. -->
  <path d="M229 247C241 237 255 238 269 249C284 262 292 283 294 307C296 331 287 356 269 376C254 363 240 344 232 323C224 301 220 268 229 247Z" fill="url(#handFill)" opacity=".98"/>

  <!-- Pearl-glass nails: restrained highlights keep the futuristic hand readable. -->
  <g filter="url(#edgeGlow)">
    <path d="M212 137C215 131 222 129 227 133C232 136 233 143 230 149C227 155 221 158 216 154C211 151 209 143 212 137Z" fill="url(#nail)" stroke="url(#nailEdge)" stroke-width="1.25"/>
    <path d="M274 207C278 201 285 199 291 202C297 205 299 212 296 218C293 224 287 227 281 224C275 221 272 213 274 207Z" fill="url(#nail)" stroke="url(#nailEdge)" stroke-width="1.1" opacity=".88"/>
    <path d="M339 234C343 228 350 226 356 229C362 232 364 238 361 244C358 250 352 253 346 250C340 247 337 240 339 234Z" fill="url(#nail)" stroke="url(#nailEdge)" stroke-width="1.05" opacity=".82"/>
    <path d="M394 260C398 255 404 254 409 257C414 260 416 266 413 271C410 276 405 278 400 275C395 272 392 265 394 260Z" fill="url(#nail)" stroke="url(#nailEdge)" stroke-width="1" opacity=".78"/>
  </g>
  <g fill="#FFFFFF" opacity=".62">
    <ellipse cx="218" cy="136" rx="3.2" ry="1.15" transform="rotate(-24 218 136)"/>
    <ellipse cx="280" cy="206" rx="2.4" ry=".9" transform="rotate(-22 280 206)"/>
    <ellipse cx="345" cy="233" rx="2.1" ry=".8" transform="rotate(-20 345 233)"/>
    <ellipse cx="399" cy="259" rx="1.8" ry=".7" transform="rotate(-18 399 259)"/>
  </g>

  <!-- Soft skin-fold contours: low contrast, curved, and aligned to each joint. -->
  <g fill="none" stroke-linecap="round">
    <path d="M216 187C225 183 237 185 245 191" stroke="#9CEFFF" stroke-width="1.35" opacity=".34"/>
    <path d="M221 199C229 196 238 197 245 201" stroke="#020A17" stroke-width="1.5" opacity=".5"/>
    <path d="M278 242C289 237 303 240 311 247" stroke="#9CEFFF" stroke-width="1.25" opacity=".3"/>
    <path d="M282 253C292 250 303 252 311 258" stroke="#020A17" stroke-width="1.4" opacity=".5"/>
    <path d="M341 268C351 264 364 267 371 274" stroke="#9CEFFF" stroke-width="1.2" opacity=".28"/>
    <path d="M344 279C354 276 364 279 372 285" stroke="#020A17" stroke-width="1.35" opacity=".48"/>
    <path d="M394 294C403 291 414 294 421 300" stroke="#9CEFFF" stroke-width="1.1" opacity=".25"/>
    <path d="M396 304C405 302 414 304 422 310" stroke="#020A17" stroke-width="1.3" opacity=".46"/>
    <path d="M206 329C221 323 239 326 254 337C264 344 274 352 284 359" stroke="#B6F7FF" stroke-width="1.45" opacity=".26"/>
    <path d="M213 342C228 337 244 340 258 350" stroke="#020A17" stroke-width="2" opacity=".48"/>
    <path d="M231 373C248 365 269 369 285 382" stroke="#A0EEFF" stroke-width="1.3" opacity=".22"/>
    <path d="M237 384C254 378 270 381 283 391" stroke="#020A17" stroke-width="1.7" opacity=".43"/>
    <path d="M193 307C198 316 205 324 214 331" stroke="#E7FDFF" stroke-width="1.25" opacity=".28"/>
  </g>

  <path d="M235 155C237 192 241 222 244 253C246 276 239 293 236 297" stroke="#DDFBFF" stroke-width="2" opacity=".62" stroke-linecap="round"/>
  <path d="M276 221C281 242 283 267 282 287" stroke="#7CEBFF" stroke-width="1.4" opacity=".38" stroke-linecap="round"/>
  <path d="M341 247C347 268 349 291 348 309" stroke="#7CEBFF" stroke-width="1.3" opacity=".3" stroke-linecap="round"/>
  <path d="M390 275C396 299 397 319 398 333" stroke="#7CEBFF" stroke-width="1.2" opacity=".26" stroke-linecap="round"/>
  <path d="M194 291C189 305 192 320 202 333" stroke="#DDFBFF" stroke-width="1.6" opacity=".45" stroke-linecap="round"/>

  <!-- Final click glint sits above the index nail. -->
  <circle cx="220" cy="145" r="18" fill="#DDA8FF" opacity=".16" filter="url(#blur12)"/>
  <circle cx="220" cy="145" r="8.5" fill="#FFF4FF" opacity=".9" filter="url(#blur4)"/>
  <circle cx="220" cy="145" r="8" stroke="#FFFFFF" stroke-width="1.8" opacity=".95"/>
</svg>
